name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make curl unzip zip mingw-w64 libfluidsynth-dev libxtst-dev

      # Ubuntu 24.04 has no SDL3 package; the Linux zt only needs it to link.
      - name: Build SDL3
        run: |
          curl -fL https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.tar.gz | tar xz -C /tmp
          cmake -S /tmp/SDL3-3.4.20 -B /tmp/sdl3-build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl3-build -j
          sudo cmake --install /tmp/sdl3-build

      - name: Build Linux
        run: make

      - name: Build Windows
        run: make win

      - name: Pack
        run: |
          win=zt-$GITHUB_REF_NAME-Windows-x64
          linux=zt-$GITHUB_REF_NAME-Linux-x64
          mkdir $win $linux
          cp -r zt.exe SDL3.dll libfluidsynth-3.dll sndfile.dll data README.md recomplauncher.json $win
          cp -r zt data README.md recomplauncher.json $linux
          zip -r $win.zip $win
          tar czf $linux.tar.gz $linux
          echo "ASSETS=$win.zip $linux.tar.gz" >> $GITHUB_ENV

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" $ASSETS --title "$GITHUB_REF_NAME"
